name = "market-runs-edge"
main = "../apps/edge/src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [
  { name = "MARKET_DO", class_name = "MarketDO" },
  { name = "PRODUCT_DO", class_name = "ProductDO" },
  { name = "CART_DO", class_name = "CartDO" },
  { name = "RUN_DO", class_name = "RunDO" },
  { name = "PARTICIPANT_DO", class_name = "ParticipantDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MarketDO", "ProductDO", "CartDO", "RunDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ParticipantDO"]

[[queues.producers]]
binding = "ARCHIVE_QUEUE"
queue = "archive-snapshots"

[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "notification-events"

[[r2_buckets]]
binding = "ARCHIVE_BUCKET"
bucket_name = "market-runs-archive"

[vars]
# Dev-only: base URL of the archive service for the ops console reputation
# panel. In deployed environments this becomes a Service binding.
OPS_ARCHIVE_URL = "http://localhost:8788"

# Dev-only: base URL of the identity service for the /auth/* proxy
# (face enroll/verify, device keys, sessions, device reset).
# Service binding in prod, like OPS_ARCHIVE_URL.
IDENTITY_URL = "http://localhost:8789"

# Dev-only: base URL of the payments service for the ops console payments
# proxy (/ops/api/admin/payments → GET /dispatches). Service binding in prod.
PAYMENTS_URL = "http://localhost:8790"

# Dev-only: durable notification reads and participant realtime callbacks.
# TODO(production): override NOTIFICATIONS_URL for the deployed hostname, or
# replace URL fetches with a NOTIFICATIONS Service binding (requires an edge
# code change); keep NOTIFICATION_INTERNAL_TOKEN in wrangler secrets.
NOTIFICATIONS_URL = "http://localhost:8791"

# Secrets stay out of this file — set them with wrangler; all are required by staging validation:
#   wrangler secret put IDENTITY_SESSION_SECRET   # on BOTH edge and identity
#   wrangler secret put IDENTITY_INTERNAL_TOKEN   # on BOTH edge and identity — guarded /auth/* and Ops routes
#   wrangler secret put PAYMENTS_INTERNAL_TOKEN   # on BOTH edge and payments — all worker service auth
#   wrangler secret put ARCHIVE_INTERNAL_TOKEN    # on BOTH edge and archive — reputation/admin/active-run reads
#   wrangler secret put NOTIFICATION_INTERNAL_TOKEN # on BOTH edge and notifications — reads and delivery callbacks
#   wrangler secret put ID_DOCUMENT_HMAC_SECRET   # edge only — keyed BVN/NIN digests
#   wrangler secret put OPS_AUTH_SECRET           # edge only — Better Auth, at least 32 characters
#   wrangler secret put RESEND_API_KEY            # edge + notifications — ops magic links and delivery
#   (IDENTITY_ENCRYPTION_KEY lives on the identity worker only)

# Dev-only: the free public OSRM demo server (no key, demo usage policy).
# Production must point at the self-hosted deployment — see infra/osrm.
OSRM_BASE_URL = "https://router.project-osrm.org"

# Staging validation rejects missing or loopback values instead of inheriting
# the local [vars] above.
[env.staging]
name = "market-runs-edge-staging"

[env.staging.vars]
PAYMENTS_REQUIRED = "true"
OPS_BASE_URL = "https://market-runs-edge-staging.leslie-bund.workers.dev"
OPS_DASHBOARD_URL = "https://market-runs-ops-staging.leslie-bund.workers.dev"
RESEND_FROM_EMAIL = "Market Runs <hello@updates.marketruns.org>"
EDGE_ENV = "staging"
OPS_ARCHIVE_URL = "https://market-runs-archive-staging.leslie-bund.workers.dev"
IDENTITY_URL = "https://market-runs-identity-staging.leslie-bund.workers.dev"
PAYMENTS_URL = "https://market-runs-payments-staging.leslie-bund.workers.dev"
NOTIFICATIONS_URL = "https://market-runs-notifications-staging.leslie-bund.workers.dev"

[env.staging.durable_objects]
bindings = [
  { name = "MARKET_DO", class_name = "MarketDO" },
  { name = "PRODUCT_DO", class_name = "ProductDO" },
  { name = "CART_DO", class_name = "CartDO" },
  { name = "RUN_DO", class_name = "RunDO" },
  { name = "PARTICIPANT_DO", class_name = "ParticipantDO" }
]

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["MarketDO", "ProductDO", "CartDO", "RunDO"]

[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["ParticipantDO"]

[[env.staging.queues.producers]]
binding = "ARCHIVE_QUEUE"
queue = "archive-snapshots-staging"

[[env.staging.queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "notification-events-staging"

[[env.staging.r2_buckets]]
binding = "ARCHIVE_BUCKET"
bucket_name = "market-runs-archive-staging"

# Native Worker-to-Worker paths. Public URLs stay configured for mobile and
# provider callbacks; local development continues using the URL proxies.
[[env.staging.services]]
binding = "ARCHIVE_SERVICE"
service = "market-runs-archive-staging"

[[env.staging.services]]
binding = "IDENTITY_SERVICE"
service = "market-runs-identity-staging"

[[env.staging.services]]
binding = "PAYMENTS_SERVICE"
service = "market-runs-payments-staging"

[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "2469ee7722ac4e328386a7279795628a"
