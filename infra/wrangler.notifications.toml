name = "market-runs-notifications"
main = "../apps/notifications/src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[queues.consumers]]
queue = "notification-events"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "notification-events-dlq"

[vars]
EDGE_URL = "http://localhost:8787"

# DATABASE_URL (dev) or Hyperdrive (prod) is supplied at runtime.
# wrangler secret put RESEND_API_KEY
# RESEND_FROM_EMAIL is a verified non-secret sender identity.
# wrangler secret put NOTIFICATION_INTERNAL_TOKEN  # on BOTH edge and notifications; required in staging/production
# ALLOW_HEADER_AUTH=true is an explicit local demo only and must not be set in deployed environments.

# Replace the example hostname before deploying. Deployed queue/fetch validation
# rejects missing service auth or loopback EDGE_URL values instead of using local [vars].
[env.staging]
name = "market-runs-notifications-staging"

[env.staging.vars]
RESEND_FROM_EMAIL = "Market Runs <hello@updates.marketruns.org>"
NOTIFICATIONS_ENV = "staging"
EDGE_URL = "https://market-runs-edge-staging.leslie-bund.workers.dev"

[[env.staging.queues.consumers]]
queue = "notification-events-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "notification-events-dlq-staging"

[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "2469ee7722ac4e328386a7279795628a"
