name = "market-runs-archive"
main = "../apps/archive/src/index.ts"
compatibility_date = "2025-01-01"
# The postgres-js driver (Postgres via Hyperdrive/DATABASE_URL) uses Node APIs.
compatibility_flags = ["nodejs_compat"]

[[queues.consumers]]
queue = "archive-snapshots"
max_batch_size = 10
max_batch_timeout = 5

[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "notification-events"

[[r2_buckets]]
binding = "ARCHIVE_BUCKET"
bucket_name = "market-runs-archive"

# DATABASE_URL (dev) or the Hyperdrive binding (prod) is provided at deploy
# time — never committed. Dev: a local Postgres container (infra/README).

# Named environments do not inherit resource bindings. These staging resources
# pair with the edge producers; provision Hyperdrive separately.
[env.staging]
name = "market-runs-archive-staging"

[[env.staging.queues.consumers]]
queue = "archive-snapshots-staging"
max_batch_size = 10
max_batch_timeout = 5

[[env.staging.queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "notification-events-staging"

[[env.staging.r2_buckets]]
binding = "ARCHIVE_BUCKET"
bucket_name = "market-runs-archive-staging"
