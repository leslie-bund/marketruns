name = "market-runs-identity"
main = "../apps/identity/src/index.ts"
compatibility_date = "2025-01-01"
# The postgres-js driver (Postgres via Hyperdrive/DATABASE_URL) uses Node APIs.
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8789

# DATABASE_URL (dev) or the Hyperdrive binding (prod) is provided at deploy
# time — never committed. Secrets: IDENTITY_ENCRYPTION_KEY, IDENTITY_SESSION_
# SECRET, IDENTITY_INTERNAL_TOKEN via `wrangler secret put`; committed dev
# defaults exist (apps/identity/src/env.ts) so the local stack runs out of the
# box, matching the OPS_TOKEN posture (ADR-0015). Vars: FACE_VERIFIER (default
# "stub"; "smileid" = vendor-held async mode, requires SMILEID_PARTNER_ID +
# SMILEID_API_KEY secrets — see infra/.dev.vars.example), FACE_MATCH_THRESHOLD
# (default 0.6), FIDO_UPSERT_ENABLED, FIDO_STUB_ENABLED.
