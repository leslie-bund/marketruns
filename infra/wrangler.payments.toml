name = "market-runs-payments"
main = "../apps/payments/src/index.ts"
compatibility_date = "2025-01-01"
# The postgres-js driver (Postgres via Hyperdrive/DATABASE_URL) uses Node APIs.
compatibility_flags = ["nodejs_compat"]

[[queues.consumers]]
queue = "payment-dispatch"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
# Failed dispatches exhaust retries into the DLQ; the payment_dispatches row
# stays 'failed' and is re-runnable via POST /dispatches/:id/replay.
dead_letter_queue = "payment-dispatch-dlq"

[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "notification-events"

[[queues.producers]]
binding = "PAYMENT_QUEUE"
queue = "payment-dispatch"

[vars]
# "stub" keeps zero-secret dev working. The Flutterwave dispatcher is chosen
# via infra/.dev.vars (PAYMENT_DISPATCHER = "flutterwave" + the vendor keys —
# see infra/.dev.vars.example); .dev.vars overrides these [vars] and is
# gitignored (ADR-0009: vendor config lives only in the quarantine module).
PAYMENT_DISPATCHER = "stub"

# All non-webhook HTTP routes fail closed without PAYMENTS_INTERNAL_TOKEN.
# Set the same secret on edge and payments for every deployed flow.
# Local header-auth demo additionally requires ALLOW_HEADER_AUTH = "true" on
# BOTH workers (prefer infra/.dev.vars; never enable it in deployed posture).

# DATABASE_URL (dev) or the Hyperdrive binding (prod) is provided at deploy
# time — never committed. Dev: a local Postgres container (infra/README).

# Named environments do not inherit resource bindings. This safe staging
# dispatcher moves no money; opt into a vendor only with explicit staging keys.
[env.staging]
name = "market-runs-payments-staging"

[env.staging.vars]
PAYMENT_DISPATCHER = "flutterwave"

[[env.staging.queues.consumers]]
queue = "payment-dispatch-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "payment-dispatch-dlq-staging"

[[env.staging.queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "notification-events-staging"

[[env.staging.queues.producers]]
binding = "PAYMENT_QUEUE"
queue = "payment-dispatch-staging"

[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "2469ee7722ac4e328386a7279795628a"
